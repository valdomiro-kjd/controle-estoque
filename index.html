<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Indicadores de Estoque — Painel de Controle</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg1:#1c2540;--bg2:#0b0f19;--tx:#e8ecf3;--mut:#8d99b0;--pn:#121a2b;--pn2:#161e30;
  --bd:#2c3a57;--bd2:#1f2b45;--trk:#1d2740;--nd:#f1f5f9;--nm:#cfd7e6;--tick:#6b7893;
  --cell-gw:170px;--cell-fs:11px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg1:#eef2fb;--bg2:#dfe6f4;--tx:#18202f;--mut:#5b6780;--pn:#fff;--pn2:#f4f6fb;
    --bd:#c6d0e3;--bd2:#d7deec;--trk:#dbe2f0;--nd:#1e293b;--nm:#2b3649;--tick:#8a96ae
  }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  display:flex;flex-direction:column;
  background:radial-gradient(circle at 50% 0,var(--bg1),var(--bg2) 70%);
  color:var(--tx);font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overflow-y:auto;overflow-x:hidden
}

/* Cabeçalho Superior */
#bar{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;
  border-bottom:1px solid var(--bd2);background:rgba(18,26,43,0.85);backdrop-filter:blur(8px)
}
.brand{display:flex;flex-direction:column;gap:1px;margin-right:12px}
h1{font-size:16px;margin:0;white-space:nowrap;display:flex;align-items:center;gap:6px}
.version-tag{
  font-size:10px;font-weight:600;color:#38bdf8;background:rgba(56,189,248,0.12);
  border:1px solid rgba(56,189,248,0.3);padding:1px 6px;border-radius:4px
}
.sub{color:var(--mut);font-size:11px}

button,select,input{
  font:inherit;border-radius:8px;border:1px solid var(--bd);background:var(--pn2);
  color:var(--tx);padding:6px 12px
}
button{cursor:pointer;background:#3b6ef6;border-color:#3b6ef6;color:#fff;font-weight:700}
button:hover{opacity:0.9}
button.g{background:var(--pn2);color:var(--tx);border-color:var(--bd);font-weight:500}
button.up{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:4px 10px;font-weight:600}
button.up small{font-size:9.5px;font-weight:400;color:var(--mut);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.up.ok{border-color:#22c55e}

#q{width:160px}#lim{width:54px;padding:5px 6px}
.seg{display:flex}.seg button{border-radius:0;white-space:nowrap}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0;border-left:0}
.seg button.g.on{background:#3b6ef6;color:#fff;border-color:#3b6ef6}
.chip{flex-shrink:0;white-space:nowrap}.chip small{color:var(--mut);font-weight:500}

/* Banner Informativo */
#bannerStatus{
  padding:6px 16px;font-size:11.5px;font-weight:600;display:flex;align-items:center;
  justify-content:space-between;border-bottom:1px solid var(--bd2);
  background:#0f172a;color:#94a3b8;flex-wrap:wrap;gap:8px
}

#main{flex:1;min-height:0;padding:10px 14px;display:flex;flex-direction:column}
#drops{display:flex;gap:18px;margin:auto;flex-wrap:wrap;justify-content:center}
.drop{width:300px;text-align:center;border:2px dashed var(--bd);border-radius:16px;padding:36px 20px;color:var(--mut);cursor:pointer}
.drop.over{border-color:#3b6ef6}.drop h2{color:var(--tx);margin:0 0 6px;font-size:16px}.drop p{margin:4px 0}
.drop b{display:inline-block;background:#3b6ef6;color:#fff;border-radius:99px;padding:2px 10px;margin-bottom:1
